<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Rambam · Hiljot Teshuvá · Capítulo 4</title>
<link rel="stylesheet" href="../../boletin/comun/estilo.css">
<style>
  :root{ --cuerpo:1.15; }
  /* Este texto no es un boletín: no lleva barra ni tabla, y el encabezado
     es más sobrio. Lo demás se hereda del CSS común. */
  .masthead{ padding:4mm 5mm 3.5mm; }
  .mh-title .he{ font-size:22pt; }
  .halaja{ break-after:avoid; margin:3.2mm 0 1.6mm; }
  .halaja .in{ grid-column:1 / -1; text-align:center;
    border-top:.7pt solid var(--oro-claro); border-bottom:.7pt solid var(--oro-claro);
    padding:1mm 0; background:var(--crema); }
  .halaja .in .he{ font-family:'FrankRuhl',serif; direction:rtl; font-weight:700;
    font-size:11.5pt; color:var(--azul); text-align:center; }
  .halaja .in .es{ font-family:'Garamond',serif; font-size:8.2pt; font-weight:600;
    letter-spacing:.5pt; text-transform:uppercase; color:var(--oro); text-align:center; }
  /* Los apartados que el Rambam numera con letras hebreas */
  .item{ margin-bottom:1.5mm; }
  .item .he, .item .es{ padding-inline-start:1mm; }
  .num{ font-weight:700; color:var(--oro); }
</style>
</head>
