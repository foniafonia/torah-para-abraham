<script>
// Rellena los huecos que deja la diferencia de longitud entre el hebreo y el
// castellano. Se ejecuta con las fuentes ya cargadas, porque antes las
// medidas no valen. Nunca hace crecer una fila: si la tarjeta no cabe, se
// degrada a version compacta y, si tampoco, se retira.
document.fonts.ready.then(() => {
  const MM = 96 / 25.4;
  const voces = {};
  for (const v of document.getElementById('glosario').content.querySelectorAll('[data-clave]')) {
    voces[v.dataset.clave] = v.dataset;
  }

  const alto = el => el.getBoundingClientRect().height;

  const tarjeta = d => {
    const c = document.createElement('div');
    c.className = 'glosa';
    c.innerHTML = `<div class="voz">${d.he}</div><div class="tr">${d.tr}</div>` +
      `<div class="def larga">${d.es || d.corto}</div><div class="def breve">${d.corto}</div>`;
    return c;
  };
  const filigrana = () => {
    const f = document.createElement('div');
    f.className = 'filigrana';
    f.innerHTML = '<i></i>';
    return f;
  };

  const pares = [...document.querySelectorAll('.par')]
    .filter(p => !p.closest('.acer') && !p.classList.contains('h-sec'));

  for (const p of pares) {
    const he = p.querySelector(':scope > .he');
    const es = p.querySelector(':scope > .es');
    if (!he || !es) continue;

    const fila = alto(p);
    const corta = alto(he) <= alto(es) ? he : es;
    const hueco = (fila - alto(corta)) / MM;

    const clave = p.dataset.glosa;
    let pieza = null;
    if (clave && voces[clave] && hueco >= 13) pieza = tarjeta(voces[clave]);
    else if (hueco >= 9) pieza = filigrana();
    if (!pieza) continue;

    corta.appendChild(pieza);
    // Si la fila ha crecido, la pieza no cabia: primero se prueba compacta.
    if (alto(p) > fila + 1 && pieza.classList.contains('glosa')) {
      pieza.classList.add('compacta');
    }
    if (alto(p) > fila + 1) {
      pieza.remove();
    }
  }

  // Tira de terminos al cierre: aprovecha el blanco del final de la ultima
  // pagina. Se monta entera y luego se recortan filas hasta que el documento
  // cabe en 4 paginas, asi que se ajusta sola si el texto cambia.
  const panel = document.getElementById('panel-glosario');
  if (panel) {
    panel.className = 'glosario-final';
    panel.innerHTML =
      '<div class="cabeza"><span class="he">מִילּוֹן הַמֻּנָּחִים</span>' +
      '<span class="es">Glosario de t&eacute;rminos</span></div>' +
      '<div class="rejilla">' + Object.values(voces).map(d =>
        `<div class="voz-panel"><span class="t">${d.he}</span>` +
        `<span class="p">${d.tr}</span><span class="d">${d.corto}</span></div>`
      ).join('') + '</div>';

    // Cuantas filas caben no se puede saber midiendo: depende de donde parta
    // las paginas el motor de impresion. Lo decide generar.mjs, que renderiza,
    // cuenta paginas y llama aqui hasta que el boletin cabe en cuatro.
    const COLS = 4;
    const rejilla = panel.querySelector('.rejilla');
    window.__recortarGlosario = () => {
      if (!rejilla.children.length) { panel.remove(); return false; }
      for (let i = 0; i < COLS && rejilla.lastElementChild; i++) rejilla.lastElementChild.remove();
      if (!rejilla.children.length) panel.remove();
      return true;
    };
  }

  window.__glosarioListo = true;
});
</script>
